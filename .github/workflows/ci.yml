name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Noctorium-Base comes in as the base/ submodule, which settings.gradle.kts falls back to.
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # The TV's screens and what they show, on the JVM with Robolectric.
      - run: ./gradlew :tv:testDebugUnitTest --stacktrace
